[package]
name = "friday"
version = "0.1.0"
edition = "2021"

[lib]
name = "friday_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
russh = "0.45"
russh-sftp = "2"
keyring = { version = "3", features = ["windows-native"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
async-trait = "0.1"
dirs = "5"
which = "7"
regex = "1"
thiserror = "2"
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
fastembed = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
ureq = { version = "2", features = ["proxy-from-env", "native-certs"] }
winreg = "0.55"
rmcp = { version = "3", features = ["server", "macros", "transport-streamable-http-server", "client", "transport-child-process", "transport-async-rw", "transport-streamable-http-client"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"
futures = "0.3"
sse-stream = "0.2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
